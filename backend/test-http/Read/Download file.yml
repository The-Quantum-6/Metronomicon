# Public, no auth needed — but only resolves for a key that belongs to an
# APPROVED resource (see resource_key_is_active). For a pending or denied
# upload this should 400.
http:
  method: GET
  url: http://localhost:3000/files/REPLACE_WITH_KEY
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
