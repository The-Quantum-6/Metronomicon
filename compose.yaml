services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_started

  frontend:
    build: ./frontend
    depends_on:
      - backend
    env_file:
      - .env
    restart: unless-stopped

  proxy:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./testing.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  db:
    image: postgres:18
    ports:
      - "5432:5432"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  garage:
    image: dxflrs/garage:v2.3.0
    # --single-node auto-creates the cluster layout, and --default-bucket
    # creates the bucket + access key from the GARAGE_DEFAULT_* variables
    # below. No manual one-time setup needed (see GARAGE.md).
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    ports:
      - "3900:3900"
    environment:
      # Reuses the S3 credentials from .env so backend and Garage always agree.
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-test-bucket}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    restart: unless-stopped

volumes:
  db_data:
  garage_meta:
  garage_data:
